name: Lint

# Checks the one thing this Shipment ships: that the profiler ASI builds, and that the manifest
# describing it passes `qm lint`.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # manifest.yaml declares src/mercs2_profiler.asi, which is built from client/ rather than
      # committed. qm refuses a declared source that does not exist — M0110, exit 1 — so there is
      # nothing to lint until the ASI has been built.
      - name: Build the client ASI
        uses: ./.github/actions/build-asi

      # qm ships as a prebuilt binary; nothing here needs a Rust toolchain on the runner itself.
      # The version comes from .github/qm-version, shared with release.yml, so a release is checked
      # against the same rules every push was.
      #
      # GitHub records a sha256 for every release asset. It is read BEFORE downloading, so the check
      # is against what the release claims to hold rather than against the bytes that arrived.
      - name: Install qm (version from .github/qm-version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          QM_VERSION="$(tr -d '[:space:]' < .github/qm-version)"
          case "$QM_VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::.github/qm-version holds '$QM_VERSION', not a vX.Y.Z qm release tag"; exit 1 ;;
          esac
          repo=Mercenaries-Fan-Build/mercs2-wad-simulator
          asset=qm-linux-x86_64
          want=$(gh api "repos/$repo/releases/tags/$QM_VERSION" \
            --jq ".assets[] | select(.name == \"$asset\") | .digest") \
            || { echo "::error::qm release $QM_VERSION was not found in $repo — check .github/qm-version"; exit 1; }
          if [ -z "$want" ]; then
            echo "::error::$asset is not in qm $QM_VERSION — check .github/qm-version"
            exit 1
          fi
          want=${want#sha256:}
          gh release download "$QM_VERSION" --repo "$repo" --pattern "$asset" --output qm
          got=$(sha256sum qm | cut -d' ' -f1)
          if [ "$want" != "$got" ]; then
            echo "::error::$asset failed verification — expected $want, got $got"
            exit 1
          fi
          echo "qm $QM_VERSION verified: $got"
          chmod +x qm

      # Hermetic: no game install, no retail WADs, no network beyond fetching qm and the crates the
      # ASI build pulled. Gated on the EXIT CODE, not on what gets printed.
      - name: Lint this Shipment
        run: ./qm lint .

      # What a green lint above actually covered. Printed even when the lint fails, so a failure can
      # be read against the rule that produced it — but only when qm itself was installed, so a
      # failed download does not report a second, misleading failure here.
      - name: What was checked
        if: always() && hashFiles('qm') != ''
        run: ./qm rules
